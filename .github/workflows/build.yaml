name: Docker Image Build and Push
on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build and Push Docker Image to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Docker Hub registry login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Installing dependencies
        run: |
          docker-compose run --rm php composer update --prefer-dist
          docker-compose run --rm php composer install    

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: pravinrajmarimuthu/phpapp:${{ github.sha }}

      - name: Login to EC2 instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/php
            echo "Replacing the image tag in docker-compose.yaml with the new image tag..."
            sed -i 's|image: pravinrajmarimuthu/phpapp:.*|image: pravinrajmarimuthu/phpapp:${{ github.sha }}|' docker-compose.yaml
            ./deploy.sh