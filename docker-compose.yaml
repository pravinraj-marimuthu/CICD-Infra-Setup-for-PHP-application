version: '3'
services:
  php:
    image: pravinrajmarimuthu/phpapp:latest
    volumes:
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      - ./:/app:delegated
    ports:
      - '8000:80'

    deploy:
      replicas: 
      resources:
        limits:
          memory: 500M
        reservations:
          memory: 200M